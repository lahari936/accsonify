services:
  backend:
    build:
      context: ./accsonify-backend
      dockerfile: Dockerfile
    container_name: accsonify-backend
    environment:
      ALLOW_MOCK_MODE: "false"
      FRONTEND_ORIGIN: "http://localhost:3000"
      PORT: "8000"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./accsonify-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: "http://localhost:8000"
    container_name: accsonify-frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
